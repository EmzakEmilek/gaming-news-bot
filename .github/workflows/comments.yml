name: Comments

on:
  # DOČASNE VYPNUTÉ, kým nie je schválený prvý ostrý post (potom odkomentovať).
  # schedule:
  #   - cron: "17 * * * *"   # každú hodinu
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Len vypíš, čo by urobil"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  comments:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install anthropic requests PyYAML
      - run: |
          git config user.name "gaming-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then python -m bot.comments --dry-run; else python -m bot.comments; fi
      - name: Save state
        if: always()
        run: ./scripts/commit_state.sh comments
