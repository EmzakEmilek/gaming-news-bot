name: Tests

# Testy pri každej zmene kódu. Nevolajú Claude ani Instagram, nič nestoja.
# Commity stavu ("state: ... [skip ci]") ich nespúšťajú.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest pyflakes
      - name: Pyflakes
        run: python -m pyflakes bot/ tests/
      - name: Pytest
        run: python -m pytest -q tests
