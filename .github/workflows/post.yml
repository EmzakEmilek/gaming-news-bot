name: Post

on:
  # Hlavný spúšťač je cron-job.org (11:30 a 18:30 slovenského času, workflow_dispatch).
  # Toto je len záloha: GitHub beží v UTC, preto 2 časy na slot (leto aj zima). Postovať smie len
  # do schedule_window_minutes PO čase slotu, beh pred slotom (v zime o hodinu skôr) nič neurobí.
  schedule:
    - cron: "40 9 * * *"    # leto 11:40 | zima 10:40 (pred slotom, nič nerobí)
    - cron: "40 10 * * *"   # leto 12:40 | zima 11:40
    - cron: "40 16 * * *"   # leto 18:40 | zima 17:40 (pred slotom, nič nerobí)
    - cron: "40 17 * * *"   # leto 19:40 | zima 18:40
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Len testovací beh (nič nepublikuje)"
        type: boolean
        default: true
      force:
        description: "Postni aj keď už v tomto slote bol post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04  # pevná verzia: prechod ubuntu-latest na novú verziu nesmie rozbiť Playwright
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache Playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - run: |
          git config user.name "gaming-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m bot.post $ARGS
      - name: Save state
        if: always()
        run: ./scripts/commit_state.sh post
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: post-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore
