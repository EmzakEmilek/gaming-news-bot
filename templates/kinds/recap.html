{# „V skratke“: snímka na odfotenie a poslanie #}
<style>
  .recap { position: absolute; left: 88px; right: 88px; top: 200px; bottom: 150px; display: flex; flex-direction: column; justify-content: center; gap: 56px; z-index: 3; }
  .recap .point { font-size: 50px; }
</style>
  {{ pager() }}
  <div class="recap" data-box>
    <div>
      <div class="idx">V skratke</div>
      <div class="points">
        {% for p in points %}<div class="point"><div class="n">{{ loop.index }}</div><div>{{ p }}</div></div>{% endfor %}
      </div>
    </div>
  </div>
  <div class="bottom"><div>Odfoť si to alebo pošli ďalej</div><div class="swipe">→</div></div>
