<style>
  .qz-bg { position: absolute; inset: 0; z-index: 0;
    background: repeating-linear-gradient(0deg, rgba(255,195,0,.06) 0 2px, transparent 2px 54px),
                repeating-linear-gradient(90deg, rgba(255,195,0,.06) 0 2px, transparent 2px 54px), #0A0A0A; }
  .qz-title { position: absolute; left: 64px; right: 64px; top: 170px; font-family: "Anton"; text-transform: uppercase; font-size: 150px; line-height: 1; z-index: 3; }
  .qz-title span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .qz-frame { position: absolute; left: 64px; right: 64px; top: 360px; height: 640px; border: 10px solid var(--accent); border-radius: 30px;
    background-size: cover; background-position: center; z-index: 2; box-shadow: 0 30px 90px rgba(0,0,0,.6); }
  .qz-mark { position: absolute; right: 30px; bottom: -70px; width: 190px; height: 190px; border-radius: 50%; background: var(--accent3);
    display: grid; place-items: center; font-family: "Anton"; font-size: 140px; color: #fff; box-shadow: 0 0 0 12px #0A0A0A; }
  .qz-sub { position: absolute; left: 64px; right: 300px; top: 1060px; font-size: 38px; font-weight: 700; line-height: 1.3; z-index: 3; }
</style>
  <div class="qz-bg"></div>
  {{ topbar(date) }}
  <div class="qz-title">Uhádneš <span>hru?</span></div>
  <div class="qz-frame" style="background-image:url('{{ image }}')"><div class="qz-mark">?</div></div>
  <div class="qz-sub">{{ sub }}</div>
  <div class="bottom"><div>{{ brand.handle }}</div><div class="swipe">SWIPNI →</div></div>
